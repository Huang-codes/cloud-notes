name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 配置 Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: 自动接受 Android SDK 协议
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license" || true
          echo "84831b9409646a297e704a0815eb079c6b797968" >> "$ANDROID_HOME/licenses/android-sdk-license" || true
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_HOME/licenses/android-sdk-license" || true

      - name: 编译 Debug APK
        run: |
          cd android
          gradle assembleDebug --no-daemon --stacktrace

      - name: 上传构建产物 (APK)
        uses: actions/upload-artifact@v4
        with:
          name: CloudNotes-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
