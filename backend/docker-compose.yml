version: '3.8'

services:
  orange-notes-api:
    build: .
    container_name: orange-notes-api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - NOTE_DB_PATH=/app/data/notes.db
      - NOTE_UPLOAD_DIR=/app/uploads
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
