<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>橙子笔记 - 简洁优雅的私有云笔记</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            orange: {
              50: '#fff7ed', 100: '#ffedd5', 200: '#fed7aa', 300: '#fdba74',
              400: '#fb923c', 500: '#f97316', 600: '#ea580c', 700: '#c2410c'
            }
          }
        }
      }
    }
  </script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    body {
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 antialiased min-h-screen transition-colors pb-24">

  <!-- 顶部导航条 -->
  <header class="sticky top-0 z-30 bg-white/90 dark:bg-slate-800/90 backdrop-blur shadow-sm border-b border-slate-200 dark:border-slate-700 px-4 py-3">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-orange-500 to-amber-400 flex items-center justify-center text-white shadow-md shadow-orange-500/20">
          <i class="fa-solid fa-lemon"></i>
        </div>
        <h1 class="font-bold text-lg text-slate-900 dark:text-white tracking-tight">橙子笔记</h1>
      </div>
      
      <div class="flex items-center space-x-2">
        <!-- 深色模式切换按钮 -->
        <button onclick="toggleDarkMode()" class="p-2 text-slate-500 hover:text-orange-500 dark:text-slate-300 transition" title="切换深色模式">
          <i id="themeIcon" class="fa-solid fa-moon text-lg"></i>
        </button>
        <!-- 回收站入口 -->
        <button onclick="openTrashModal()" class="p-2 text-slate-500 hover:text-orange-500 dark:text-slate-300 transition" title="回收站">
          <i class="fa-solid fa-trash-can text-lg"></i>
        </button>
        <!-- 用户信息/退出登录 -->
        <button onclick="handleUserClick()" class="p-2 text-slate-500 hover:text-orange-500 dark:text-slate-300 transition" title="账号">
          <i class="fa-solid fa-user-circle text-xl"></i>
        </button>
      </div>
    </div>

    <!-- 搜索栏 -->
    <div class="max-w-md mx-auto mt-2">
      <div class="relative">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400"></i>
        <input 
          id="searchInput" 
          type="text" 
          placeholder="搜索笔记标题或内容..." 
          oninput="handleSearch()"
          class="w-full bg-slate-100 dark:bg-slate-700/60 border border-slate-200 dark:border-slate-600 rounded-full pl-9 pr-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500/20 focus:border-orange-500 text-slate-800 dark:text-white"
        >
      </div>
    </div>
  </header>

  <!-- 笔记卡片容器 -->
  <main class="max-w-md mx-auto px-4 mt-4">
    <div id="loadingIndicator" class="text-center py-8 text-slate-400">
      <i class="fa-solid fa-circle-notch fa-spin text-2xl text-orange-500 mb-2"></i>
      <p class="text-sm">正在加载橙子笔记...</p>
    </div>

    <div id="emptyState" class="hidden text-center py-16 text-slate-400">
      <i class="fa-regular fa-note-sticky text-5xl mb-3 text-orange-200 dark:text-slate-600"></i>
      <p class="font-medium text-slate-600 dark:text-slate-300">暂无笔记</p>
      <p class="text-xs text-slate-400 mt-1">点击右下角按钮添加你的第一条笔记</p>
    </div>

    <div id="notesContainer" class="space-y-3">
      <!-- 动态插入笔记 -->
    </div>
  </main>

  <!-- 悬浮新建按钮 -->
  <div class="fixed bottom-6 right-6 z-40 max-w-md">
    <button 
      onclick="openEditModal(null)" 
      class="w-14 h-14 bg-gradient-to-tr from-orange-500 to-amber-500 hover:from-orange-600 hover:to-amber-600 active:scale-95 text-white rounded-full shadow-lg shadow-orange-500/30 flex items-center justify-center text-xl transition-all"
      title="新建笔记"
    >
      <i class="fa-solid fa-plus"></i>
    </button>
  </div>

  <!-- 编辑/新建笔记弹窗（支持自动保存与待办清单） -->
  <div id="editModal" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white dark:bg-slate-800 w-full max-w-md rounded-t-2xl sm:rounded-2xl max-h-[92vh] flex flex-col shadow-2xl overflow-hidden">
      <!-- 模态头部 -->
      <div class="px-5 py-3 border-b border-slate-100 dark:border-slate-700 flex items-center justify-between">
        <div class="flex items-center space-x-2">
          <h3 id="modalTitle" class="font-bold text-slate-800 dark:text-white text-base">新建笔记</h3>
          <span id="autoSaveStatus" class="text-[11px] text-emerald-500 font-medium hidden">
            <i class="fa-solid fa-check mr-1"></i>已自动保存
          </span>
        </div>
        <button onclick="closeEditModal()" class="text-slate-400 hover:text-slate-600 p-1">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <!-- 快捷工具栏（富文本与待办） -->
      <div class="px-4 py-2 bg-slate-50 dark:bg-slate-700/50 border-b border-slate-100 dark:border-slate-700 flex items-center space-x-3 text-sm text-slate-600 dark:text-slate-300">
        <button onclick="insertFormat('**', '**', '加粗文本')" class="hover:text-orange-500" title="加粗"><i class="fa-solid fa-bold"></i></button>
        <button onclick="insertFormat('*', '*', '斜体文本')" class="hover:text-orange-500" title="斜体"><i class="fa-solid fa-italic"></i></button>
        <button onclick="insertFormat('### ', '', '小标题')" class="hover:text-orange-500" title="标题"><i class="fa-solid fa-heading"></i></button>
        <button onclick="insertFormat('- [ ] ', '', '待办事项')" class="hover:text-orange-500" title="待办清单"><i class="fa-regular fa-square-check"></i></button>
        <button onclick="insertFormat('[链接标题](', ')', 'https://example.com')" class="hover:text-orange-500" title="插入链接"><i class="fa-solid fa-link"></i></button>
        <label class="cursor-pointer hover:text-orange-500" title="上传图片附件">
          <i class="fa-solid fa-image"></i>
          <input type="file" accept="image/*" class="hidden" onchange="uploadImage(event)">
        </label>
      </div>

      <!-- 表单内容 -->
      <div class="p-4 overflow-y-auto space-y-3 flex-1">
        <input 
          id="noteTitleInput" 
          type="text" 
          placeholder="标题..." 
          oninput="triggerAutoSave()"
          class="w-full text-lg font-bold border-b border-slate-200 dark:border-slate-700 bg-transparent py-1 focus:outline-none focus:border-orange-500 text-slate-800 dark:text-white"
        >

        <div class="flex items-center space-x-2">
          <input 
            id="noteCategoryInput" 
            type="text" 
            placeholder="分类标签 (如: 工作, 待办)" 
            oninput="triggerAutoSave()"
            class="w-1/2 px-2.5 py-1 text-xs border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-700/40 rounded-lg focus:outline-none focus:border-orange-500 text-slate-800 dark:text-white"
          >
          <label class="flex items-center space-x-1 cursor-pointer text-xs text-slate-600 dark:text-slate-300">
            <input id="notePinnedInput" type="checkbox" onchange="triggerAutoSave()" class="w-3.5 h-3.5 text-orange-500 rounded">
            <span>置顶</span>
          </label>
        </div>

        <textarea 
          id="noteContentInput" 
          rows="10" 
          placeholder="开始记录你的想法、待办或备忘..." 
          oninput="triggerAutoSave()"
          class="w-full text-sm bg-transparent border border-slate-200 dark:border-slate-700 rounded-lg p-3 focus:outline-none focus:border-orange-500 text-slate-800 dark:text-white leading-relaxed resize-none"
        ></textarea>
      </div>

      <!-- 模态框底部 -->
      <div class="px-5 py-3 bg-slate-50 dark:bg-slate-700/30 border-t border-slate-100 dark:border-slate-700 flex justify-between items-center">
        <button id="deleteBtn" onclick="deleteCurrentNote()" class="hidden text-red-500 hover:text-red-700 text-xs font-medium">
          <i class="fa-regular fa-trash-can mr-1"></i>移入回收站
        </button>
        <div class="flex space-x-2 ml-auto">
          <button onclick="closeEditModal()" class="px-4 py-1.5 text-xs text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-600 rounded-lg">完成并退出</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 回收站弹窗 -->
  <div id="trashModal" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white dark:bg-slate-800 w-full max-w-md rounded-2xl p-5 shadow-2xl flex flex-col max-h-[80vh]">
      <div class="flex items-center justify-between pb-3 border-b border-slate-100 dark:border-slate-700">
        <h3 class="font-bold text-slate-800 dark:text-white text-base"><i class="fa-solid fa-trash-can mr-2 text-orange-500"></i>回收站</h3>
        <button onclick="closeTrashModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div id="trashNotesContainer" class="flex-1 overflow-y-auto py-3 space-y-2">
        <!-- 回收站列表 -->
      </div>
    </div>
  </div>

  <!-- 登录 / 注册弹窗 -->
  <div id="authModal" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white dark:bg-slate-800 w-full max-w-sm rounded-2xl p-6 shadow-2xl space-y-4">
      <div class="text-center">
        <div class="w-12 h-12 mx-auto rounded-2xl bg-orange-500 flex items-center justify-center text-white text-2xl shadow-lg shadow-orange-500/30 mb-2">
          <i class="fa-solid fa-lemon"></i>
        </div>
        <h3 id="authTitle" class="font-bold text-lg text-slate-800 dark:text-white">登录橙子笔记</h3>
        <p class="text-xs text-slate-400 mt-0.5">你的私有云端空间，数据专属加密保存</p>
      </div>

      <div class="space-y-3 text-sm">
        <div id="usernameField" class="hidden">
          <label class="block text-xs font-semibold text-slate-500 mb-1">用户名</label>
          <input id="regUsername" type="text" placeholder="设置你的用户名" class="w-full px-3 py-2 border border-slate-200 dark:border-slate-600 rounded-lg bg-transparent text-slate-800 dark:text-white focus:outline-none focus:border-orange-500">
        </div>

        <div>
          <label id="accountLabel" class="block text-xs font-semibold text-slate-500 mb-1">账号 (用户名或邮箱)</label>
          <input id="authAccount" type="text" placeholder="例如: orange@example.com" class="w-full px-3 py-2 border border-slate-200 dark:border-slate-600 rounded-lg bg-transparent text-slate-800 dark:text-white focus:outline-none focus:border-orange-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">密码</label>
          <input id="authPassword" type="password" placeholder="请输入密码" class="w-full px-3 py-2 border border-slate-200 dark:border-slate-600 rounded-lg bg-transparent text-slate-800 dark:text-white focus:outline-none focus:border-orange-500">
        </div>
      </div>

      <div class="pt-2">
        <button id="authSubmitBtn" onclick="submitAuth()" class="w-full py-2.5 bg-orange-500 hover:bg-orange-600 active:scale-95 text-white font-medium rounded-lg text-sm transition">登录</button>
      </div>

      <div class="text-center pt-1 text-xs">
        <span id="authToggleText" class="text-slate-400">还没有账号？</span>
        <button id="authToggleBtn" onclick="toggleAuthMode()" class="text-orange-500 font-semibold hover:underline ml-1">立即注册</button>
      </div>
    </div>
  </div>

  <script>
    let isRegisterMode = false;
    let currentNoteId = null;
    let autoSaveTimer = null;
    const API_BASE = window.location.origin;

    function getAuthToken() {
      return localStorage.getItem('ORANGE_NOTE_TOKEN');
    }

    function setAuthToken(token) {
      if (token) localStorage.setItem('ORANGE_NOTE_TOKEN', token);
      else localStorage.removeItem('ORANGE_NOTE_TOKEN');
    }

    async function apiRequest(endpoint, options = {}) {
      const headers = options.headers || {};
      const token = getAuthToken();
      if (token) {
        headers['Authorization'] = `Bearer ${token}`;
      }
      if (!options.isFormData) {
        headers['Content-Type'] = 'application/json';
      }

      const res = await fetch(`${API_BASE}${endpoint}`, {
        ...options,
        headers
      });

      if (res.status === 401) {
        openAuthModal();
        throw new Error('请先登录');
      }

      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        throw new Error(data.detail || '请求失败');
      }
      return data;
    }

    // 深色模式控制
    function toggleDarkMode() {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('ORANGE_DARK_MODE', isDark ? '1' : '0');
      document.getElementById('themeIcon').className = isDark ? 'fa-solid fa-sun text-lg text-amber-400' : 'fa-solid fa-moon text-lg';
    }

    // 初始化深色模式
    if (localStorage.getItem('ORANGE_DARK_MODE') === '1' || (!('ORANGE_DARK_MODE' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
      document.getElementById('themeIcon').className = 'fa-solid fa-sun text-lg text-amber-400';
    }

    // 账号切换
    function openAuthModal() {
      document.getElementById('authModal').classList.remove('hidden');
    }
    function closeAuthModal() {
      document.getElementById('authModal').classList.add('hidden');
    }

    function toggleAuthMode() {
      isRegisterMode = !isRegisterMode;
      document.getElementById('authTitle').innerText = isRegisterMode ? '注册橙子笔记账号' : '登录橙子笔记';
      document.getElementById('usernameField').classList.toggle('hidden', !isRegisterMode);
      document.getElementById('accountLabel').innerText = isRegisterMode ? '电子邮箱' : '账号 (用户名或邮箱)';
      document.getElementById('authSubmitBtn').innerText = isRegisterMode ? '立即注册' : '登录';
      document.getElementById('authToggleText').innerText = isRegisterMode ? '已有账号？' : '还没有账号？';
      document.getElementById('authToggleBtn').innerText = isRegisterMode ? '前往登录' : '立即注册';
    }

    async function submitAuth() {
      const account = document.getElementById('authAccount').value.trim();
      const password = document.getElementById('authPassword').value.trim();
      if (!account || !password) return alert('请填写完整账号与密码');

      try {
        if (isRegisterMode) {
          const username = document.getElementById('regUsername').value.trim();
          if (!username) return alert('请输入用户名');
          const res = await apiRequest('/api/auth/register', {
            method: 'POST',
            body: JSON.stringify({ username, email: account, password })
          });
          setAuthToken(res.access_token);
        } else {
          const res = await apiRequest('/api/auth/login', {
            method: 'POST',
            body: JSON.stringify({ account, password })
          });
          setAuthToken(res.access_token);
        }
        closeAuthModal();
        loadNotes();
      } catch (err) {
        alert(err.message);
      }
    }

    function handleUserClick() {
      if (getAuthToken()) {
        if (confirm('确认退出当前登录吗？')) {
          setAuthToken(null);
          openAuthModal();
        }
      } else {
        openAuthModal();
      }
    }

    // 笔记加载与渲染
    async function loadNotes(query = '') {
      document.getElementById('loadingIndicator').classList.remove('hidden');
      document.getElementById('emptyState').classList.add('hidden');
      try {
        const url = query ? `/api/notes?q=${encodeURIComponent(query)}` : '/api/notes';
        const notes = await apiRequest(url);
        renderNotes(notes);
      } catch (err) {
        console.error(err);
      } finally {
        document.getElementById('loadingIndicator').classList.add('hidden');
      }
    }

    function renderNotes(notes) {
      const container = document.getElementById('notesContainer');
      const emptyState = document.getElementById('emptyState');
      container.innerHTML = '';

      if (!notes || notes.length === 0) {
        emptyState.classList.remove('hidden');
        return;
      }
      emptyState.classList.add('hidden');

      notes.forEach(note => {
        const card = document.createElement('div');
        card.className = "bg-white dark:bg-slate-800 rounded-xl p-4 shadow-sm border border-slate-200/80 dark:border-slate-700/80 hover:shadow-md transition active:bg-slate-50 dark:active:bg-slate-700/50 cursor-pointer";
        card.onclick = () => openEditModal(note);

        const pinnedBadge = note.is_pinned 
          ? `<span class="text-[11px] text-orange-600 dark:text-orange-400 bg-orange-50 dark:bg-orange-950/60 px-2 py-0.5 rounded-full font-medium mr-1.5"><i class="fa-solid fa-thumbtack mr-1 text-[10px]"></i>置顶</span>` 
          : '';

        const categoryBadge = note.category 
          ? `<span class="text-[11px] text-slate-500 dark:text-slate-400 bg-slate-100 dark:bg-slate-700 px-2 py-0.5 rounded-full font-medium"># ${escapeHtml(note.category)}</span>`
          : '';

        card.innerHTML = `
          <div class="flex items-center justify-between">
            <h4 class="font-bold text-slate-900 dark:text-white text-base line-clamp-1 flex-1">${escapeHtml(note.title)}</h4>
            <div class="flex items-center space-x-1 ml-2">
              ${pinnedBadge}
              ${categoryBadge}
            </div>
          </div>
          <p class="text-slate-600 dark:text-slate-300 text-sm mt-2 line-clamp-3 leading-relaxed whitespace-pre-wrap">${escapeHtml(note.content)}</p>
          <div class="mt-3 pt-2 border-t border-slate-100 dark:border-slate-700/60 flex items-center justify-between text-[11px] text-slate-400">
            <span>更新于: ${note.updated_at}</span>
            <span class="text-slate-300"><i class="fa-solid fa-chevron-right text-[10px]"></i></span>
          </div>
        `;
        container.appendChild(card);
      });
    }

    let searchTimer = null;
    function handleSearch() {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        loadNotes(document.getElementById('searchInput').value.trim());
      }, 300);
    }

    // 自动保存逻辑
    function triggerAutoSave() {
      const statusEl = document.getElementById('autoSaveStatus');
      statusEl.classList.add('hidden');
      clearTimeout(autoSaveTimer);
      autoSaveTimer = setTimeout(() => {
        saveNote(true);
      }, 1000); // 停顿1秒自动保存
    }

    function openEditModal(note) {
      currentNoteId = note ? note.id : null;
      document.getElementById('modalTitle').innerText = note ? '编辑笔记' : '新建笔记';
      document.getElementById('noteTitleInput').value = note ? note.title : '';
      document.getElementById('noteCategoryInput').value = note ? (note.category || '') : '';
      document.getElementById('noteContentInput').value = note ? note.content : '';
      document.getElementById('notePinnedInput').checked = note ? note.is_pinned : false;

      const deleteBtn = document.getElementById('deleteBtn');
      if (note) deleteBtn.classList.remove('hidden');
      else deleteBtn.classList.add('hidden');

      document.getElementById('editModal').classList.remove('hidden');
    }

    function closeEditModal() {
      // 退出前强制保存一次
      saveNote(true);
      document.getElementById('editModal').classList.add('hidden');
      currentNoteId = null;
      loadNotes();
    }

    async function saveNote(isAuto = false) {
      const title = document.getElementById('noteTitleInput').value.trim();
      const content = document.getElementById('noteContentInput').value.trim();
      const category = document.getElementById('noteCategoryInput').value.trim() || '默认';
      const is_pinned = document.getElementById('notePinnedInput').checked;

      if (!title && !content) return;

      try {
        if (currentNoteId) {
          await apiRequest(`/api/notes/${currentNoteId}`, {
            method: 'PUT',
            body: JSON.stringify({ title: title || '无标题', content, category, is_pinned })
          });
        } else {
          const res = await apiRequest('/api/notes', {
            method: 'POST',
            body: JSON.stringify({ title: title || '无标题', content, category, is_pinned })
          });
          currentNoteId = res.id;
        }
        if (isAuto) {
          const statusEl = document.getElementById('autoSaveStatus');
          statusEl.classList.remove('hidden');
        }
      } catch (err) {
        console.error('保存失败:', err);
      }
    }

    async function deleteCurrentNote() {
      if (!currentNoteId) return;
      if (!confirm('确定将笔记移入回收站吗？')) return;
      try {
        await apiRequest(`/api/notes/${currentNoteId}`, { method: 'DELETE' });
        document.getElementById('editModal').classList.add('hidden');
        currentNoteId = null;
        loadNotes();
      } catch (err) {
        alert(err.message);
      }
    }

    // 回收站功能
    async function openTrashModal() {
      document.getElementById('trashModal').classList.remove('hidden');
      const container = document.getElementById('trashNotesContainer');
      container.innerHTML = '<p class="text-xs text-slate-400 text-center py-4">正在读取回收站...</p>';
      try {
        const notes = await apiRequest('/api/notes/trash/list');
        if (!notes || notes.length === 0) {
          container.innerHTML = '<p class="text-xs text-slate-400 text-center py-8">回收站是空的</p>';
          return;
        }
        container.innerHTML = '';
        notes.forEach(note => {
          const item = document.createElement('div');
          item.className = "p-3 bg-slate-50 dark:bg-slate-700/50 rounded-lg flex items-center justify-between text-xs";
          item.innerHTML = `
            <div class="flex-1 mr-3 line-clamp-1 font-medium text-slate-700 dark:text-slate-200">${escapeHtml(note.title)}</div>
            <div class="flex space-x-2">
              <button onclick="restoreNote(${note.id})" class="text-emerald-600 hover:underline">还原</button>
              <button onclick="permanentDeleteNote(${note.id})" class="text-red-500 hover:underline">彻底删除</button>
            </div>
          `;
          container.appendChild(item);
        });
      } catch (err) {
        alert(err.message);
      }
    }

    function closeTrashModal() {
      document.getElementById('trashModal').classList.add('hidden');
      loadNotes();
    }

    async function restoreNote(id) {
      await apiRequest(`/api/notes/${id}/restore`, { method: 'POST' });
      openTrashModal();
    }

    async function permanentDeleteNote(id) {
      if (!confirm('彻底删除后将无法恢复，确定吗？')) return;
      await apiRequest(`/api/notes/${id}/permanent`, { method: 'DELETE' });
      openTrashModal();
    }

    // 富文本与附件工具
    function insertFormat(prefix, suffix, defaultText) {
      const textarea = document.getElementById('noteContentInput');
      const start = textarea.selectionStart;
      const end = textarea.selectionEnd;
      const selected = textarea.value.substring(start, end) || defaultText;
      const replacement = prefix + selected + suffix;
      textarea.value = textarea.value.substring(0, start) + replacement + textarea.value.substring(end);
      triggerAutoSave();
    }

    async function uploadImage(e) {
      const file = e.target.files[0];
      if (!file) return;
      const formData = new FormData();
      formData.append('file', file);
      try {
        const res = await apiRequest('/api/upload', {
          method: 'POST',
          body: formData,
          isFormData: true
        });
        insertFormat(`\n![${file.name}](`, `)\n`, res.url);
      } catch (err) {
        alert('图片上传失败: ' + err.message);
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.innerText = text || '';
      return div.innerHTML;
    }

    window.addEventListener('DOMContentLoaded', () => {
      if (!getAuthToken()) {
        openAuthModal();
      } else {
        loadNotes();
      }
    });
  </script>
</body>
</html>
