<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>云端记事本</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    /* iOS 平滑回弹与触摸优化 */
    body {
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen pb-24">

  <!-- 顶部导航条 -->
  <header class="sticky top-0 z-30 bg-white/95 backdrop-blur shadow-sm border-b border-slate-200 px-4 py-3">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center text-white shadow-md">
          <i class="fa-solid fa-cloud"></i>
        </div>
        <h1 class="font-bold text-lg text-slate-900 tracking-tight">云端记事本</h1>
      </div>
      <button onclick="openTokenModal()" title="设置服务密钥" class="p-2 text-slate-500 hover:text-blue-600 transition">
        <i class="fa-solid fa-gear text-lg"></i>
      </button>
    </div>

    <!-- 搜索栏 -->
    <div class="max-w-md mx-auto mt-2">
      <div class="relative">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400"></i>
        <input 
          id="searchInput" 
          type="text" 
          placeholder="搜索笔记标题或内容..." 
          oninput="handleSearch()"
          class="w-full bg-slate-100 border border-slate-200 rounded-full pl-9 pr-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500"
        >
      </div>
    </div>
  </header>

  <!-- 主体笔记列表容器 -->
  <main class="max-w-md mx-auto px-4 mt-4">
    <!-- 状态加载条 -->
    <div id="loadingIndicator" class="text-center py-8 text-slate-400">
      <i class="fa-solid fa-circle-notch fa-spin text-2xl text-blue-500 mb-2"></i>
      <p class="text-sm">正在加载云端笔记...</p>
    </div>

    <!-- 空数据状态 -->
    <div id="emptyState" class="hidden text-center py-16 text-slate-400">
      <i class="fa-regular fa-note-sticky text-5xl mb-3 text-slate-300"></i>
      <p class="font-medium text-slate-600">暂无笔记记录</p>
      <p class="text-xs text-slate-400 mt-1">点击右下角按钮添加你的第一条笔记</p>
    </div>

    <!-- 笔记卡片列表 -->
    <div id="notesContainer" class="space-y-3">
      <!-- 动态插入笔记卡片 -->
    </div>
  </main>

  <!-- 浮动新建按钮 -->
  <div class="fixed bottom-6 right-6 z-40 max-w-md">
    <button 
      onclick="openEditModal(null)" 
      class="w-14 h-14 bg-blue-600 hover:bg-blue-700 active:scale-95 text-white rounded-full shadow-lg shadow-blue-500/30 flex items-center justify-center text-xl transition-all"
      title="新建笔记"
    >
      <i class="fa-solid fa-plus"></i>
    </button>
  </div>

  <!-- 编辑/新建笔记弹窗 -->
  <div id="editModal" class="hidden fixed inset-0 z-50 bg-black/50 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4 transition-opacity">
    <div class="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl max-h-[90vh] flex flex-col shadow-2xl overflow-hidden animate-slide-up">
      <!-- 模态框头部 -->
      <div class="px-5 py-4 border-b border-slate-100 flex items-center justify-between">
        <h3 id="modalTitle" class="font-bold text-slate-800 text-lg">新建笔记</h3>
        <button onclick="closeEditModal()" class="text-slate-400 hover:text-slate-600 p-1">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <!-- 输入表单 -->
      <div class="p-5 overflow-y-auto space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">标题</label>
          <input 
            id="noteTitleInput" 
            type="text" 
            placeholder="笔记标题..." 
            class="w-full px-3 py-2 text-base font-medium border border-slate-200 rounded-lg focus:outline-none focus:border-blue-500"
          >
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">分类 / 标签</label>
          <input 
            id="noteCategoryInput" 
            type="text" 
            placeholder="例如: 日常, 工作, 灵感" 
            class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:border-blue-500"
          >
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">正文内容</label>
          <textarea 
            id="noteContentInput" 
            rows="7" 
            placeholder="写下你的想法、备忘或清单..." 
            class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:border-blue-500"
          ></textarea>
        </div>

        <div class="flex items-center justify-between pt-1">
          <label class="flex items-center space-x-2 cursor-pointer text-sm text-slate-700">
            <input id="notePinnedInput" type="checkbox" class="w-4 h-4 text-blue-600 rounded">
            <span>置顶此笔记</span>
          </label>
          <button id="deleteBtn" onclick="deleteCurrentNote()" class="hidden text-red-500 hover:text-red-700 text-sm font-medium">
            <i class="fa-regular fa-trash-can mr-1"></i>删除笔记
          </button>
        </div>
      </div>

      <!-- 模态框底部 -->
      <div class="px-5 py-3 bg-slate-50 border-t border-slate-100 flex justify-end space-x-3">
        <button onclick="closeEditModal()" class="px-4 py-2 text-sm text-slate-600 hover:bg-slate-200 rounded-lg">取消</button>
        <button onclick="saveNote()" class="px-5 py-2 text-sm bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg shadow-sm">保存</button>
      </div>
    </div>
  </div>

  <!-- Token 设置弹窗 -->
  <div id="tokenModal" class="hidden fixed inset-0 z-50 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-sm rounded-2xl p-5 shadow-2xl space-y-4">
      <div class="flex items-center justify-between">
        <h3 class="font-bold text-slate-800 text-base">API 访问密钥设置</h3>
        <button onclick="closeTokenModal()" class="text-slate-400 hover:text-slate-600">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <p class="text-xs text-slate-500 leading-relaxed">
        为保护云端笔记安全，请填入与服务器 <code class="bg-slate-100 px-1 py-0.5 rounded text-blue-600">API_TOKEN</code> 一致的访问秘钥。
      </p>
      <div>
        <input 
          id="tokenInput" 
          type="text" 
          placeholder="例如: cloud-notes-secret" 
          class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:border-blue-500 font-mono"
        >
      </div>
      <div class="flex justify-end space-x-2 pt-2">
        <button onclick="closeTokenModal()" class="px-4 py-2 text-xs text-slate-600 hover:bg-slate-100 rounded-lg">取消</button>
        <button onclick="saveToken()" class="px-4 py-2 text-xs bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg">确认保存</button>
      </div>
    </div>
  </div>

  <!-- 前端交互逻辑 -->
  <script>
    let currentNoteId = null;
    let allNotes = [];
    const API_BASE = window.location.origin;

    function getToken() {
      return localStorage.getItem('CLOUD_NOTES_TOKEN') || 'cloud-notes-secret';
    }

    function setToken(token) {
      localStorage.setItem('CLOUD_NOTES_TOKEN', token.trim());
    }

    async function apiRequest(endpoint, options = {}) {
      const headers = options.headers || {};
      headers['X-API-Token'] = getToken();
      headers['Content-Type'] = 'application/json';

      const res = await fetch(`${API_BASE}${endpoint}`, {
        ...options,
        headers
      });

      if (res.status === 401) {
        openTokenModal();
        throw new Error('未授权，请检查 API Token');
      }

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.detail || '请求失败');
      }

      return res.json();
    }

    async function loadNotes(query = '') {
      document.getElementById('loadingIndicator').classList.remove('hidden');
      document.getElementById('emptyState').classList.add('hidden');
      try {
        const url = query ? `/api/notes?q=${encodeURIComponent(query)}` : '/api/notes';
        allNotes = await apiRequest(url);
        renderNotes(allNotes);
      } catch (err) {
        console.error(err);
      } finally {
        document.getElementById('loadingIndicator').classList.add('hidden');
      }
    }

    function renderNotes(notes) {
      const container = document.getElementById('notesContainer');
      const emptyState = document.getElementById('emptyState');
      container.innerHTML = '';

      if (!notes || notes.length === 0) {
        emptyState.classList.remove('hidden');
        return;
      }

      emptyState.classList.add('hidden');

      notes.forEach(note => {
        const card = document.createElement('div');
        card.className = "bg-white rounded-xl p-4 shadow-sm border border-slate-200/70 hover:shadow-md transition active:bg-slate-50 cursor-pointer relative";
        card.onclick = () => openEditModal(note);

        const pinnedBadge = note.is_pinned 
          ? `<span class="inline-flex items-center text-xs text-amber-600 bg-amber-50 px-2 py-0.5 rounded-full font-medium mr-2">
               <i class="fa-solid fa-thumbtack mr-1 text-[10px]"></i>置顶
             </span>` 
          : '';

        const categoryBadge = note.category 
          ? `<span class="text-xs text-blue-600 bg-blue-50 px-2 py-0.5 rounded-full font-medium"># ${escapeHtml(note.category)}</span>`
          : '';

        card.innerHTML = `
          <div class="flex items-start justify-between">
            <h4 class="font-bold text-slate-900 text-base line-clamp-1 flex-1">${escapeHtml(note.title)}</h4>
            <div class="flex items-center space-x-1 ml-2">
              ${pinnedBadge}
              ${categoryBadge}
            </div>
          </div>
          <p class="text-slate-600 text-sm mt-2 line-clamp-3 leading-relaxed whitespace-pre-wrap">${escapeHtml(note.content)}</p>
          <div class="mt-3 pt-2 border-t border-slate-100 flex items-center justify-between text-[11px] text-slate-400">
            <span>更新于: ${note.updated_at}</span>
            <span class="text-slate-300 hover:text-slate-600"><i class="fa-solid fa-chevron-right"></i></span>
          </div>
        `;
        container.appendChild(card);
      });
    }

    let searchTimer = null;
    function handleSearch() {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        const q = document.getElementById('searchInput').value.trim();
        loadNotes(q);
      }, 300);
    }

    function openEditModal(note) {
      currentNoteId = note ? note.id : null;
      document.getElementById('modalTitle').innerText = note ? '编辑笔记' : '新建笔记';
      document.getElementById('noteTitleInput').value = note ? note.title : '';
      document.getElementById('noteCategoryInput').value = note ? (note.category || '') : '';
      document.getElementById('noteContentInput').value = note ? note.content : '';
      document.getElementById('notePinnedInput').checked = note ? note.is_pinned : false;

      const deleteBtn = document.getElementById('deleteBtn');
      if (note) {
        deleteBtn.classList.remove('hidden');
      } else {
        deleteBtn.classList.add('hidden');
      }

      document.getElementById('editModal').classList.remove('hidden');
    }

    function closeEditModal() {
      document.getElementById('editModal').classList.add('hidden');
      currentNoteId = null;
    }

    async function saveNote() {
      const title = document.getElementById('noteTitleInput').value.trim();
      const content = document.getElementById('noteContentInput').value.trim();
      const category = document.getElementById('noteCategoryInput').value.trim() || '默认';
      const is_pinned = document.getElementById('notePinnedInput').checked;

      if (!title) {
        alert('请输入笔记标题');
        return;
      }

      try {
        if (currentNoteId) {
          await apiRequest(`/api/notes/${currentNoteId}`, {
            method: 'PUT',
            body: JSON.stringify({ title, content, category, is_pinned })
          });
        } else {
          await apiRequest('/api/notes', {
            method: 'POST',
            body: JSON.stringify({ title, content, category, is_pinned })
          });
        }
        closeEditModal();
        loadNotes();
      } catch (err) {
        alert('保存失败: ' + err.message);
      }
    }

    async function deleteCurrentNote() {
      if (!currentNoteId) return;
      if (!confirm('确定要删除这条笔记吗？')) return;

      try {
        await apiRequest(`/api/notes/${currentNoteId}`, { method: 'DELETE' });
        closeEditModal();
        loadNotes();
      } catch (err) {
        alert('删除失败: ' + err.message);
      }
    }

    function openTokenModal() {
      document.getElementById('tokenInput').value = getToken();
      document.getElementById('tokenModal').classList.remove('hidden');
    }

    function closeTokenModal() {
      document.getElementById('tokenModal').classList.add('hidden');
    }

    function saveToken() {
      const token = document.getElementById('tokenInput').value;
      setToken(token);
      closeTokenModal();
      loadNotes();
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.innerText = text || '';
      return div.innerHTML;
    }

    // 初始化加载
    window.addEventListener('DOMContentLoaded', () => {
      loadNotes();
    });
  </script>
</body>
</html>
